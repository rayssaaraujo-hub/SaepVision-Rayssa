<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAEPVision</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="user-area"><img id="avatar" src="/assets/imagens_usuarios/usuario1.jpg"><div><strong id="userName">SAEPVision</strong><button id="profileBtn" class="dark" disabled>Ver Perfil</button></div></div><h1>SAEPVision</h1><button id="loginBtn" class="dark">Login</button></header>
<main><div class="search"><input id="search" placeholder="Digite o nome do fotógrafo... ex: fotografo1"><img src="/assets/icones/lupa.svg"></div><p id="notice" class="notice"></p><section id="gallery" class="gallery"></section></main>
<footer><span>SAEPVision</span><div class="social"><img src="/assets/icones/instagram.svg"><img src="/assets/icones/tiktok.svg"><img src="/assets/icones/linkedIn.svg"><img src="/assets/icones/youtube.svg"></div><span>Copyright 2026-2027</span></footer>
<div id="modal" class="overlay hidden"><form id="loginForm" class="modal"><button type="button" id="closeModal" class="close">×</button><h2>Login</h2><label>E-mail<input id="email" type="email" placeholder="Digite seu e-mail" required></label><label>Senha<input id="password" type="password" placeholder="Digite sua senha" required></label><p id="loginError" class="error"></p><div class="actions"><button type="button" id="cancelLogin" class="outline">Cancelar</button><button class="primary">Login</button></div></form></div>
<aside id="sidebar" class="sidebar hidden"><button id="closeSide" class="close">×</button><h2 id="sideName">Perfil</h2><p id="stats"></p><button id="myPosts" class="outline full">Suas publicações</button><button id="logout" class="dark full">Logout</button><hr><h3>Nova fotografia</h3><form id="postForm"><label>Título da Imagem<input name="titulo" required placeholder="Ex.: Dedo de Deus"></label><label>Local onde foi tirada<input name="local" required placeholder="Ex.: Rio de Janeiro"></label><label>Imagem<input name="imagem" type="file" accept=".jpg,.jpeg,.png,.gif,.webp" required></label><button class="primary full">Cadastrar</button></form><div id="myList"></div></aside>
<script src="/app.js"></script></body></html>
